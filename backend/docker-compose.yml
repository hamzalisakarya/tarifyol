services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: tarifyol
      POSTGRES_USER: tarifyol
      POSTGRES_PASSWORD: ${TARIFYOL_DB_PASSWORD:?Set TARIFYOL_DB_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tarifyol-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarifyol -d tarifyol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tarifyol-postgres:
